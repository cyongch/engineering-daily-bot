name: 工程行业早报每日推送

on:
  schedule:
    - cron: '30 22 * * *'   # UTC 22:30 = 北京时间 06:30
  workflow_dispatch:        # 允许手动触发验证

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖（含 Playwright）
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: 抓取资讯源
        run: node scripts/fetch.js
      - name: 生成内容简述
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: node scripts/summarize.js
      - name: 构建页面
        run: node scripts/build.js
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: 推送至企业微信群机器人
        # 未配置 WECOM_WEBHOOK 时静默跳过；推送失败不影响 Pages 部署
        continue-on-error: true
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SITE_URL: https://cyongch.github.io/engineering-daily-bot/
        run: node scripts/notify-wecom.js

      - name: 推送至企业微信自建应用（同显个人微信）
        # 自建应用 gettoken 默认不强制 IP 白名单，可在云端直接跑；
        # 成员开启「在微信中接收企业消息」后，消息同显个人微信。
        # 未配置 WECOM_CORPID/WECOM_APP_SECRET/WECOM_AGENTID 时静默跳过。
        continue-on-error: true
        env:
          WECOM_CORPID: ${{ secrets.WECOM_CORPID }}
          WECOM_APP_SECRET: ${{ secrets.WECOM_APP_SECRET }}
          WECOM_AGENTID: ${{ secrets.WECOM_AGENTID }}
          WECOM_TOUSER: ${{ secrets.WECOM_TOUSER }}
          SITE_URL: https://cyongch.github.io/engineering-daily-bot/
        run: node scripts/notify-wecom-app.js

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
